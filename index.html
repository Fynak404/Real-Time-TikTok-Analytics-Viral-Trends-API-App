<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AllStack — Dashboard Ready</title>
<style>
  :root {
    --bg: #0F0C16;
    --surface: #161224;
    --border: rgba(255,255,255,0.08);
    --text: #FFFFFF;
    --muted: #8B8794;
    --mono: #B4B0BE;
    --accent: #A855F7;
    --accent-hover: #9333EA;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono-font: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 56px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .check {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: rgba(168, 85, 247, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--accent);
  }
  h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .sub {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 32px;
  }
  .url-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    font-family: var(--mono-font);
    font-size: 14px;
    color: var(--mono);
    margin-bottom: 12px;
    user-select: all;
    -webkit-user-select: all;
  }
  .bookmark {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .bookmark span {
    color: var(--accent);
    font-weight: 500;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 15px 24px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }
  .btn:active {
    transform: translateY(0);
  }
  .footer {
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Your AllStack dashboard is ready.</h1>
    <p class="sub">
      Save this link — it's the only place to access your dashboard.
    </p>
    <div class="url-box">all-stack.whop.site</div>
    <p class="bookmark">
      <span>📌</span> Bookmark it now so you never lose it.
    </p>
    <a class="btn" href="https://all-stack.whop.site">Open My Dashboard →</a>
    <p class="footer">
      You can also find this link anytime in your Whop purchases.
    </p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AllStack — Dashboard Ready</title>
<style>
  :root {
    --bg: #0A0A0A;
    --glass: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.10);
    --text: #FFFFFF;
    --muted: #8A8A8E;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 620px;
    height: 620px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.10), transparent 70%);
    top: -220px;
    left: -180px;
  }
  body::after {
    width: 560px;
    height: 560px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.06), transparent 70%);
    bottom: -220px;
    right: -160px;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 64px 40px 56px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.12) inset,
      0 -1px 0 rgba(0, 0, 0, 0.40) inset,
      0 24px 60px rgba(0, 0, 0, 0.65),
      0 8px 24px rgba(0, 0, 0, 0.40);
  }

  .check {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--text);
    box-shadow: 0 0 32px rgba(255, 255, 255, 0.10);
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.6px;
    margin-bottom: 14px;
    color: var(--text);
  }

  .sub {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 40px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px 24px;
    background: linear-gradient(180deg, #FFFFFF 0%, #E5E5E7 100%);
    color: #0A0A0A;
    text-decoration: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.80) inset,
      0 10px 30px rgba(255, 255, 255, 0.14);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.90) inset,
      0 14px 40px rgba(255, 255, 255, 0.22);
  }
  .btn:active { transform: translateY(0); }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Your dashboard is ready.</h1>
    <p class="sub">Everything is set up. You're good to go.</p>

    <a class="btn"
       href="https://all-stack.whop.site"
       target="_blank"
       rel="noopener noreferrer">
      Open My Dashboard →
    </a>
  </div>
</body>
</html>
